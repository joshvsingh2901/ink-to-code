name: Repair frontend dependency lock

on:
  push:
    branches:
      - chore/repo-polish-security-fix

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/repo-polish-security-fix
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Refresh patched frontend dependencies
        working-directory: frontend
        run: |
          npm install next@16.3.8 eslint-config-next@16.3.8 monaco-editor@0.57.0
          npm audit fix || true
      - name: Verify frontend
        working-directory: frontend
        run: |
          npm test
          npm run lint
          npm run build
          npm audit --omit=dev --audit-level=high
      - name: Commit dependency refresh
        run: |
          if git diff --quiet -- frontend/package.json frontend/package-lock.json; then
            echo "No dependency changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json
          git commit -m "chore: refresh patched frontend dependencies"
          git push origin chore/repo-polish-security-fix
